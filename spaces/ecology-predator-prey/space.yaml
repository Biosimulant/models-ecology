schema_version: "2.0"
title: "Ecology: Predator-Prey"
description: "Canonical deterministic Lotka-Volterra predator-prey dynamics with built-in diagnostics and visualizations."
models:
  - repo: Biosimulant/models-ecology
    alias: lv
    manifest_path: models/ecology-lotka-volterra-system/model.yaml
    parameters:
      alpha: 1.1
      beta: 0.4
      gamma: 0.4
      delta: 0.1
      prey_initial: 10.0
      predator_initial: 5.0
      prey_name: "Rabbits"
      predator_name: "Foxes"
      min_dt: 0.1
runtime:
  duration: 40.0
  tick_dt: 0.1
  initial_inputs: {}
wiring: []
scientific_context:
  question: "How do prey and predator populations co-evolve in the canonical deterministic Lotka-Volterra system?"
  mode: "causal"
  assumptions:
    - "The only dynamics are the canonical Lotka-Volterra equations with fixed parameters alpha, beta, gamma, and delta."
    - "The model is deterministic and continuous-valued."
    - "Numerical integration uses fixed-step RK4."
  expected_observables:
    - "Oscillatory prey and predator trajectories."
    - "Closed phase-space orbits around the non-trivial equilibrium."
    - "Small drift in the conserved quantity under RK4 integration."
  limitations:
    - "Only the canonical two-species Lotka-Volterra system is modeled."
    - "No environmental forcing, carrying capacity, satiation, or stochasticity is included."
