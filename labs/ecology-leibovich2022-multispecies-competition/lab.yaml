description: Multi-model lab with an embedded visualisation sibling for the Leibovich2022 stochastic multispecies competition-immigration community model. Faithful port of the upstream MultiLV Gillespie propensity rules.
io:
  inputs:
  - maps_to: ecology_leibovich2022_multispecies_competition.carrying_capacity
    name: carrying_capacity
  - maps_to: ecology_leibovich2022_multispecies_competition.birth_rate
    name: birth_rate
  - maps_to: ecology_leibovich2022_multispecies_competition.death_rate
    name: death_rate
  - maps_to: ecology_leibovich2022_multispecies_competition.competition_overlap
    name: competition_overlap
  - maps_to: ecology_leibovich2022_multispecies_competition.immigration_rate
    name: immigration_rate
  - maps_to: ecology_leibovich2022_multispecies_competition.initial_abundance
    name: initial_abundance
  outputs:
  - maps_to: ecology_leibovich2022_multispecies_competition.community_state
    name: community_state
  - maps_to: ecology_leibovich2022_multispecies_competition.diversity_metrics
    name: diversity_metrics
models:
- alias: ecology_leibovich2022_multispecies_competition
  path: models/core
- alias: visualisation
  parameters:
    integration_step: 0.05
  path: models/visualisation
runtime:
  communication_step: 0.5
  duration: 500
  initial_inputs: {}
schema_version: '2.0'
title: Leibovich2022 Multispecies Competition Lab
wiring:
- from: ecology_leibovich2022_multispecies_competition.visualisation_payload
  to:
  - visualisation.ecology_leibovich2022_multispecies_competition_visualisation_payload
