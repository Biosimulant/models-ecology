schema_version: "2.0"
title: "Leibovich2022 Multispecies Competition Model"
description: "Stochastic multispecies competition-immigration community model, ported from the upstream MultiLV Gillespie implementation (BioModels MODEL2212080001). Uses tau-leaping with birth and death propensities matching the upstream formulas exactly."
standard: other
tags:
  - ecology
  - community-dynamics
  - competition
  - stochastic
  - faithful
authors:
  - Biosimulant Team
  - Nava Leibovich
  - Jeremy Rothschild
  - Sidhartha Goyal
  - Anton Zilman
upstream:
  id: biomodels_ebi:MODEL2212080001
  source_db: biomodels_ebi
  source_id: MODEL2212080001
  standard: python
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2212080001
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2212080001?filename=gillespie.py
  license: CC0
biosim:
  entrypoint: src.leibovich2022_competition:Leibovich2022CommunityModel
  init_kwargs:
    species_count: 6
    carrying_capacity: 100.0
    birth_rate: 2.0
    death_rate: 1.0
    competition_overlap: 0.2
    immigration_rate: 0.1
    initial_abundance: 50.0
    rng_seed: 7
  communication_step: 0.05
runtime:
  python_version: "3.12"
  dependencies:
    packages:
      - numpy==1.26.4
io:
  inputs:
    - carrying_capacity
    - birth_rate
    - death_rate
    - competition_overlap
    - immigration_rate
    - initial_abundance
  outputs:
    - community_state
    - diversity_metrics
