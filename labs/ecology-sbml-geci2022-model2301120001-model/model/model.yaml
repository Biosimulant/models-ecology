schema_version: "2.0"
title: "Geci2022 Eco-Genetic Gene Drive Suppression Model"
description: "Reduced deterministic eco-genetic reimplementation of the Geci2022 mosquito suppression study, exposing population suppression, sex-ratio distortion, drive spread, and resistance emergence as first-class ecology observables."
standard: other
tags:
  - ecology
  - population-genetics
  - gene-drive
  - mosquito
  - faithful
authors:
  - Biosimulant Team
  - "René Geci"
  - Willis K
  - Burt A
upstream:
  id: biomodels_ebi:MODEL2301120001
  source_db: biomodels_ebi
  source_id: MODEL2301120001
  standard: other
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2301120001
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2301120001?filename=new%20model%20v9.jl
  license: CC0
biosim:
  entrypoint: src.geci2022_model2301120001_model:Geci2022Model2301120001Model
  init_kwargs:
    initial_population: 12000.0
    carrying_capacity: 15000.0
    intrinsic_growth_rate: 0.85
    base_mortality_rate: 0.22
    initial_drive_frequency: 0.02
    gene_drive_conversion_rate: 0.55
    suppression_strength: 0.95
    resistance_emergence_rate: 0.04
    resistance_cost: 0.06
    sex_ratio_bias: 0.22
  communication_step: 0.1
runtime:
  python_version: "3.12"
  dependencies:
    packages:
      - numpy==1.26.4
io:
  outputs:
    - population_state
    - gene_drive_metrics
