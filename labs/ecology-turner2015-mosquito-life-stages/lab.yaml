description: Multi-model lab with an embedded visualisation sibling for Turner2015 Mosquito Life-Stage Ecology Model. Curated SBML packaging of the Turner2015 mosquito life-stage model, exposing egg, larval, and pupal trajectories together with stage-composition diagnostics for ecology-facing interpretation.
io:
  inputs:
  - maps_to: ecology_turner2015_mosquito_life_stages.integration_step
    name: integration_step
  outputs:
  - maps_to: ecology_turner2015_mosquito_life_stages.life_stage_state
    name: life_stage_state
  - maps_to: ecology_turner2015_mosquito_life_stages.population_metrics
    name: population_metrics
models:
- alias: ecology_turner2015_mosquito_life_stages
  path: models/core
- alias: visualisation
  parameters:
    integration_step: 0.1
  path: models/visualisation
runtime:
  communication_step: 1
  duration: 120
  initial_inputs: {}
schema_version: '2.0'
package: ecology-turner2015-mosquito-life-stages-lab
version: 1.0.1
title: Turner2015 Mosquito Life-Stage Ecology Model Lab
wiring:
- from: ecology_turner2015_mosquito_life_stages.visualisation_payload
  to:
  - visualisation.ecology_turner2015_mosquito_life_stages_visualisation_payload
