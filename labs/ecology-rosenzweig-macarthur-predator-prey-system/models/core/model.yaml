schema_version: '2.0'
title: Rosenzweig-MacArthur Predator-Prey System
description: Applied predator-prey model with logistic prey growth, Holling type II
  predation, and configurable ecology mechanisms.
standard: other
tags:
- ecology
- predator-prey
- rosenzweig-macarthur
- carrying-capacity
- applied
authors:
- Biosimulant Team
biosim:
  entrypoint: src.rosenzweig_macarthur:RosenzweigMacArthurPredatorPreySystem
  communication_step: 0.1
parameters:
- name: prey_initial_population
  value: 20.0
  min: 0.0
  units: count
  description: Initial prey population count for the boom-bust demonstration scenario.
- name: predator_initial_population
  value: 4.0
  min: 0.0
  units: count
  description: Initial predator population count for the boom-bust demonstration scenario.
- name: prey_growth_rate
  value: 0.8
  min: 0.0
  units: 1/day
  description: Intrinsic prey growth rate.
- name: prey_carrying_capacity
  value: 450.0
  min: 0.001
  units: count
  description: High prey carrying capacity used to expose overshoot and collapse risk.
- name: attack_rate
  value: 0.12
  min: 0.0
  units: 1/(count*day)
  description: Holling type II predator attack rate.
- name: handling_time
  value: 0.18
  min: 0.0
  units: day
  description: Predator handling time per prey item.
- name: predator_mortality_rate
  value: 0.18
  min: 0.0
  units: 1/day
  description: Predator mortality rate.
- name: predator_conversion_efficiency
  value: 0.09
  min: 0.0
  units: predator/prey
  description: Predator gain per prey consumed.
- name: food_resource_index
  value: 1.0
  min: 0.0
  units: dimensionless
  description: Relative food and habitat resource multiplier.
- name: seasonal_amplitude
  value: 0.0
  min: 0.0
  max: 0.95
  units: dimensionless
  description: Sinusoidal seasonal forcing amplitude.
- name: noise_strength
  value: 0.0
  min: 0.0
  units: dimensionless
  description: Process noise intensity.
- name: random_seed
  value: 1
  description: Deterministic seed for stochastic process noise.
- name: patch_count
  value: 1
  min: 1
  description: Number of spatial patches.
- name: migration_rate
  value: 0.0
  min: 0.0
  units: 1/day
  description: Patch exchange rate.
io:
  inputs:
  - name: prey_initial_population
    accepted_units:
    - count
    description: Initial prey population count.
  - name: predator_initial_population
    accepted_units:
    - count
    description: Initial predator population count.
  - name: prey_growth_rate
    accepted_units:
    - 1/day
    description: Intrinsic prey growth rate.
  - name: prey_carrying_capacity
    accepted_units:
    - count
    description: Prey carrying capacity.
  - name: attack_rate
    accepted_units:
    - 1/(count*day)
    description: Holling type II attack rate.
  - name: handling_time
    accepted_units:
    - day
    description: Predator handling time.
  - name: predator_mortality_rate
    accepted_units:
    - 1/day
    description: Predator mortality rate.
  - name: predator_conversion_efficiency
    accepted_units:
    - predator/prey
    description: Predator conversion efficiency.
  - name: food_resource_index
    accepted_units:
    - dimensionless
    description: Food and habitat resource multiplier.
  - name: seasonal_forcing
    accepted_units:
    - day
    description: Record with amplitude, period, and phase.
  - name: disease_parameters
    accepted_units:
    - 1/day
    description: Record with disease transmission, recovery, and mortality rates.
  - name: migration_matrix
    accepted_units:
    - 1/day
    description: Record describing patch migration.
  - name: patch_configuration
    accepted_units:
    - dimensionless
    description: Record describing patch resource and initial states.
  outputs:
  - name: visualisation_payload
    description: Internal history payload for the sibling visualisation model.
  - name: prey_population_state
    emitted_unit: count
    description: Current prey population state.
  - name: predator_population_state
    emitted_unit: count
    description: Current predator population state.
  - name: population_timeseries
    emitted_unit: count
    description: Population trajectory.
  - name: equilibrium_summary
    emitted_unit: count
    description: Equilibrium summary.
  - name: stability_summary
    emitted_unit: dimensionless
    description: Stability summary.
  - name: extinction_risk
    emitted_unit: fraction
    description: Extinction risk scores.
  - name: threshold_crossings
    emitted_unit: dimensionless
    description: Threshold crossing events.
  - name: scenario_summary
    description: Enabled mechanisms, units, and labels.
