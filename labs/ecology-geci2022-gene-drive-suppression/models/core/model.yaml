schema_version: '2.0'
title: Geci2022 Gene-Drive Suppression Model
description: Genotype-tracking gene-drive model for mosquito population suppression,
  ported from the upstream Julia implementation (BioModels MODEL2301120001). Tracks
  1071 genotypes across Y-linked editor, X-shredder, and autosomal homing components
  with discrete-generation dynamics including homing, editing, recombination, mutation,
  X-shredding, Beverton-Holt density dependence, and genotype-specific fitness selection.
standard: other
tags:
- ecology
- population-genetics
- gene-drive
- mosquito
- faithful
authors:
- Biosimulant Team
- "Ren\xE9 Geci"
- Willis K
- Burt A
upstream:
  id: biomodels_ebi:MODEL2301120001
  source_db: biomodels_ebi
  source_id: MODEL2301120001
  standard: other
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2301120001
  download_url: https://www.ebi.ac.uk/biomodels/models/core/download/MODEL2301120001?filename=new%20model%20v9.jl
  license: CC0
biosim:
  entrypoint: src.geci2022_gene_drive:Geci2022GeneDriveModel
  init_kwargs:
    net_reproduction_rate: 6.0
    juvenile_survival: 0.1
    initial_population: 1.0
    homing_efficiency: 0.95
    editing_efficiency: 0.95
    shredding_efficiency: 0.95
    copy_mutation_rate: 0.0
    background_mutation_rate: 0.0
    editing_resistance_rate: 0.0
    shredding_resistance_rate: 0.0
    homing_resistance_rate: 0.0
    fitness_cost_cas9: 0.0
    fitness_cost_grna: 0.0
    fitness_cost_shredder: 0.0
    fitness_cost_nuclease: 0.0
    fitness_cost_shredder_activity: 0.0
    fitness_cost_edited_female: 0.0
    fitness_cost_edited_male: 0.0
    dominance_editing: 0.5
    dominance_shredder: 0.5
    dominance_shredder_gamete: 0.5
    cas9_cofactor: 1.0
    recombination_rate: 0.0
    release_size: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - numpy==1.26.4
io:
  inputs:
  - name: net_reproduction_rate
    accepted_units:
    - dimensionless
    description: Net reproduction rate (R0, unbounded scalar).
  - name: juvenile_survival
    accepted_units:
    - fraction
    description: Juvenile survival probability.
  - name: initial_population
    accepted_units:
    - population
    description: Normalized initial population size.
  - name: release_size
    accepted_units:
    - fraction
    description: Transgenic release as fraction of initial population.
  - name: homing_efficiency
    accepted_units:
    - fraction
    description: Homing efficiency.
  - name: editing_efficiency
    accepted_units:
    - fraction
    description: Editing efficiency.
  - name: shredding_efficiency
    accepted_units:
    - fraction
    description: X-shredding efficiency.
  - name: copy_mutation_rate
    accepted_units:
    - fraction
    description: Copying-error mutation rate.
  - name: background_mutation_rate
    accepted_units:
    - fraction
    description: Background mutation rate.
  - name: editing_resistance_rate
    accepted_units:
    - fraction
    description: Editing resistance rate.
  - name: shredding_resistance_rate
    accepted_units:
    - fraction
    description: Shredding resistance rate.
  - name: homing_resistance_rate
    accepted_units:
    - fraction
    description: Homing resistance rate.
  - name: fitness_cost_cas9
    accepted_units:
    - fraction
    description: Cas9 expression fitness cost.
  - name: fitness_cost_grna
    accepted_units:
    - fraction
    description: gRNA expression fitness cost.
  - name: fitness_cost_shredder
    accepted_units:
    - fraction
    description: Shredder expression fitness cost.
  - name: fitness_cost_nuclease
    accepted_units:
    - fraction
    description: Nuclease activity fitness cost.
  - name: fitness_cost_shredder_activity
    accepted_units:
    - fraction
    description: Shredder activity fitness cost.
  - name: fitness_cost_edited_female
    accepted_units:
    - fraction
    description: Female edited-target fitness cost.
  - name: fitness_cost_edited_male
    accepted_units:
    - fraction
    description: Male edited-target fitness cost.
  - name: dominance_editing
    accepted_units:
    - dimensionless
    description: Dominance coefficient for female editing.
  - name: dominance_shredder
    accepted_units:
    - dimensionless
    description: Dominance coefficient for shredder activity.
  - name: dominance_shredder_gamete
    accepted_units:
    - dimensionless
    description: Dominance coefficient for shredder in gametes.
  - name: cas9_cofactor
    accepted_units:
    - dimensionless
    description: Cas9 cofactor for shredding.
  - name: recombination_rate
    accepted_units:
    - fraction
    description: X-linked recombination rate.
  outputs:
  - name: population_state
    emitted_unit: individuals
    description: Adult mosquito population partitioned into females and males.
  - name: gene_drive_metrics
    emitted_unit: fraction
    description: Eco-genetic metrics for drive spread, resistance, and suppression.
  - name: visualisation_payload
    description: Internal history payload for the sibling visualisation model.
