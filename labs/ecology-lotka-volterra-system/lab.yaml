description: "Explore idealized predator\u2013prey cycles with six controls, a complete\
  \ trajectory and numerical diagnostics. No species-specific calibration or population\
  \ forecast is claimed."
io:
  inputs:
  - maps_to: ecology_lotka_volterra_system.prey_initial_population
    name: prey_initial_population
    default: 10.0
    value_type: number
    label: Prey initial population
    description: Finite nonnegative value in count. Fixed after the run starts.
    ui:
      control: number
  - maps_to: ecology_lotka_volterra_system.predator_initial_population
    name: predator_initial_population
    default: 5.0
    value_type: number
    label: Predator initial population
    description: Finite nonnegative value in count. Fixed after the run starts.
    ui:
      control: number
  - maps_to: ecology_lotka_volterra_system.prey_growth_rate
    name: prey_growth_rate
    default: 1.1
    value_type: number
    label: Prey growth rate
    description: Finite nonnegative value in 1/day.
    ui:
      control: number
  - maps_to: ecology_lotka_volterra_system.predation_rate
    name: predation_rate
    default: 0.4
    value_type: number
    label: Predation rate
    description: Finite nonnegative value in 1/(count*day).
    ui:
      control: number
  - maps_to: ecology_lotka_volterra_system.predator_mortality_rate
    name: predator_mortality_rate
    default: 0.4
    value_type: number
    label: Predator mortality rate
    description: Finite nonnegative value in 1/day.
    ui:
      control: number
  - maps_to: ecology_lotka_volterra_system.predator_reproduction_rate
    name: predator_reproduction_rate
    default: 0.1
    value_type: number
    label: Predator reproduction rate
    description: Finite nonnegative value in 1/(count*day).
    ui:
      control: number
  outputs:
  - maps_to: ecology_lotka_volterra_system.prey_population_state
    name: prey_population_state
  - maps_to: ecology_lotka_volterra_system.predator_population_state
    name: predator_population_state
  - name: trajectory
    maps_to: ecology_lotka_volterra_system.visualisation_payload
    description: Complete trajectory from time zero to the final state, available
      at run completion. Counts are continuous model populations; times are in days.
models:
- alias: ecology_lotka_volterra_system
  path: models/core
- alias: visualisation
  parameters:
    integration_step: 0.01
  path: models/visualisation
runtime:
  communication_step: 0.01
  duration: 250
  initial_inputs:
    ecology_lotka_volterra_system:
      prey_initial_population: 10.0
      predator_initial_population: 5.0
      prey_growth_rate: 1.1
      predation_rate: 0.4
      predator_mortality_rate: 0.4
      predator_reproduction_rate: 0.1
schema_version: '2.0'
package: ecology-lotka-volterra-system-lab
version: 1.1.0
title: Lotka-Volterra System Lab
wiring:
- from: ecology_lotka_volterra_system.visualisation_payload
  to:
  - visualisation.ecology_lotka_volterra_system_visualisation_payload
intended_use: Explore the unchanged deterministic predator–prey equations and controls. No species-specific calibration, empirical population forecasts or ecosystem management claims.
