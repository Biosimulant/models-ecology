description: Multi-model lab with an embedded visualisation sibling for Pfeiffer2001 ATP-Pathway Cooperation-Competition Model. Curated SBML packaging of the Pfeiffer2001 ATP-pathway ecology model, exposing substrate dynamics, strategy-specific biomass trajectories, and pathway-fraction diagnostics instead of a generic species dump.
io:
  inputs:
  - maps_to: ecology_pfeiffer2001_atp_pathway_cooperation.integration_step
    name: integration_step
  outputs:
  - maps_to: ecology_pfeiffer2001_atp_pathway_cooperation.resource_state
    name: resource_state
  - maps_to: ecology_pfeiffer2001_atp_pathway_cooperation.community_state
    name: community_state
  - maps_to: ecology_pfeiffer2001_atp_pathway_cooperation.cooperation_metrics
    name: cooperation_metrics
models:
- alias: ecology_pfeiffer2001_atp_pathway_cooperation
  path: models/core
- alias: visualisation
  parameters:
    integration_step: 0.1
  path: models/visualisation
runtime:
  communication_step: 0.1
  duration: 75
  initial_inputs: {}
schema_version: '2.0'
title: Pfeiffer2001 ATP-Pathway Cooperation-Competition Model Lab
wiring:
- from: ecology_pfeiffer2001_atp_pathway_cooperation.visualisation_payload
  to:
  - visualisation.ecology_pfeiffer2001_atp_pathway_cooperation_visualisation_payload
