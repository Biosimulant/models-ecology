schema_version: "2.0"
title: "Pfeiffer2001 ATP-Pathway Cooperation-Competition Model Lab"
description: "Single-model lab wrapper for Pfeiffer2001 ATP-Pathway Cooperation-Competition Model. Curated SBML packaging of the Pfeiffer2001 ATP-pathway ecology model, exposing substrate dynamics, strategy-specific biomass trajectories, and pathway-fraction diagnostics instead of a generic species dump."
models:
  - alias: "ecology_pfeiffer2001_atp_pathway_cooperation"
    path: "./model"
wiring: []
runtime:
  duration: 25
  communication_step: 0.1
  initial_inputs: {}
io:
  inputs:
    - name: integration_step
      maps_to: ecology_pfeiffer2001_atp_pathway_cooperation.integration_step
  outputs:
    - name: resource_state
      maps_to: ecology_pfeiffer2001_atp_pathway_cooperation.resource_state
    - name: community_state
      maps_to: ecology_pfeiffer2001_atp_pathway_cooperation.community_state
    - name: cooperation_metrics
      maps_to: ecology_pfeiffer2001_atp_pathway_cooperation.cooperation_metrics
